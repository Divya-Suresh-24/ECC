# Apache httpd — serve the app at https://<host>/ecc-assistant/   (set ROOT_PATH=/ecc-assistant in .env)
# Requires: mod_proxy, mod_proxy_http, mod_headers   (a2enmod proxy proxy_http headers)
# Put inside the existing <VirtualHost *:443> block.

RedirectMatch 301 ^/ecc-assistant$ /ecc-assistant/
ProxyPreserveHost On
ProxyTimeout 120
ProxyPass        /ecc-assistant/ http://127.0.0.1:8010/
ProxyPassReverse /ecc-assistant/ http://127.0.0.1:8010/
RequestHeader set X-Forwarded-Proto "https"
LimitRequestBody 62914560
