# nginx — serve the app at https://<host>/ecc-assistant/   (set ROOT_PATH=/ecc-assistant in .env)
# Put inside the existing `server { ... }` block for the HTTPS site.

location = /ecc-assistant { return 301 /ecc-assistant/; }

location /ecc-assistant/ {
    proxy_pass http://127.0.0.1:8010/;          # trailing slash strips the /ecc-assistant prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;                     # answers can take ~10-30 s
    client_max_body_size 60m;                    # document uploads
}

# To serve at the site root instead, use `location / { proxy_pass http://127.0.0.1:8010; ... }` and leave ROOT_PATH empty.
